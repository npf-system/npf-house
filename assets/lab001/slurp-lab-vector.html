const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const msg=document.getElementById('msg');
async function open(pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(SALT),iterations:300000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(IV)},key,u8(CT));
  const html=new TextDecoder().decode(pt);
  try{sessionStorage.setItem('slurplab.key',pw);}catch(e){}
  document.open();document.write(html);document.close();
}
document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const pw=document.getElementById('pw').value;msg.className='';msg.textContent='deriving key…';
  try{await open(pw);}catch(err){msg.className='err';msg.textContent='wrong key';document.getElementById('pw').select();}});
try{const k=sessionStorage.getItem('slurplab.key');if(k){msg.textContent='unlocking…';open(k).catch(()=>{msg.textContent='';});}}catch(e){}
})();
</script>
