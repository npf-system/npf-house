<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NPF / SLURP LAB VECTOR</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#fff;--ink:#000;--mute:#5c5c5c;--soft:#ececec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#000;--ink:#fff;--mute:#a3a3a3;--soft:#1c1c1c}}
:root[data-theme="dark"]{--paper:#000;--ink:#fff;--mute:#a3a3a3;--soft:#1c1c1c}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:17px;line-height:1.55}
h1,h2,h3{font-family:Archivo,sans-serif;margin:0}
h1{font-weight:900;font-size:clamp(40px,8vw,112px);line-height:.92;letter-spacing:-.035em}
h2{font-weight:900;font-size:clamp(26px,4vw,44px);line-height:1;letter-spacing:-.02em;margin-bottom:.6em}
h3{font-weight:700;font-size:18px;margin:1.4em 0 .3em}
p{margin:0 0 1em;max-width:66ch}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:13px;line-height:1.4}
header{display:flex;justify-content:space-between;gap:16px;padding:14px 20px;border-bottom:2px solid var(--ink)}
.title{padding:28px 20px 22px}.title p{margin-top:18px;font-size:19px}
#stage{position:relative;height:78vh;min-height:440px;background:#fff;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);touch-action:none;cursor:grab;overflow:hidden}
#stage svg{width:100%;height:100%;display:block}
#hud{position:absolute;left:14px;top:12px;color:#000;display:grid;grid-template-columns:auto auto;gap:2px 16px;pointer-events:none}
#hud b{font-weight:500}
.panel{border-bottom:2px solid var(--ink)}
.group{padding:14px 20px;border-bottom:1px solid var(--ink)}
.group:last-child{border-bottom:0}
.group h3{margin:0 0 8px;font-size:13px;font-family:"IBM Plex Mono",monospace;font-weight:500;color:var(--mute);letter-spacing:.04em;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px 28px}
.grid label{display:block}
input[type=range]{width:100%;accent-color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font-family:"IBM Plex Mono",monospace;font-size:13px;background:var(--paper);color:var(--ink);border:2px solid var(--ink);padding:6px 11px;cursor:pointer;border-radius:0}
button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.chk{display:flex;gap:8px;align-items:center}.chk input{accent-color:var(--ink);width:16px;height:16px}
main section{padding:52px 20px;border-bottom:2px solid var(--ink)}
.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:0 56px}
@media(min-width:900px){.cols{grid-template-columns:minmax(0,5fr) minmax(0,7fr)}}
.verdict{font-family:Archivo,sans-serif;font-weight:700;font-size:clamp(22px,2.6vw,32px);line-height:1.18;max-width:30ch}
table{border-collapse:collapse;width:100%}th,td{text-align:left;vertical-align:top;padding:10px 14px 10px 0;border-top:1px solid var(--ink)}
th{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:500;color:var(--mute);border-top:2px solid var(--ink)}
td:first-child{font-family:Archivo,sans-serif;font-weight:700;white-space:nowrap}
.scroll{overflow-x:auto}.scroll table{min-width:640px}
ul{padding-left:1.1em;margin:0 0 1em;max-width:66ch}li{margin-bottom:.5em}
.note{background:var(--soft);padding:16px 18px;max-width:66ch}
footer{padding:20px;color:var(--mute)}
</style>
</head>
<body>
<header class="mono"><span><a href="/#lab" style="color:inherit;text-decoration:none">NPF</a> / LAB_001 / SLURP LAB VECTOR</span><span>REV Z</span></header>

<div id="stage" aria-label="Vektoranimation. Dra för att vrida, scrolla för zoom."><div id="hud" class="mono"></div></div>

<div class="panel mono">
  <div class="group"><h3>Kör</h3><div class="row">
    <button id="play" aria-pressed="true">Kör</button>
    <button data-view="tre">Trekvart</button><button data-view="ovan">Ovanifrån</button><button data-view="sida">Från sidan</button><button data-view="under">Underifrån</button>
    <button id="reset">Nollställ</button><button id="sym3">Symmetrisk 3 (off 0)</button><button id="sym6">Symmetrisk 6 (oktaeder)</button>
  </div></div>

  <div class="group"><h3>Spara</h3><div class="row">
    <input id="pname" class="mono" placeholder="namn på läget" style="font-size:13px;padding:6px 8px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:0">
    <button id="psave">Spara läge</button>
    <select id="plist" class="mono" style="font-size:13px;padding:6px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:0"></select>
    <button id="pload">Ladda</button><button id="pdel">Ta bort</button><button id="pexport">Kopiera som text</button><button id="pimport">Klistra in text</button>
  </div><textarea id="pbox" class="mono" rows="2" placeholder="sparad rad" style="display:none;width:100%;margin-top:8px;font-size:12px;padding:6px 8px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:0"></textarea></div>

  <div class="group"><h3>Ljud</h3><div class="row" style="margin-bottom:8px">
    <button id="snd" aria-pressed="false">Ljud på</button>
    <span>Klang</span><button data-syn="additive" aria-pressed="true">Hela ytan (additiv)</button><button data-syn="edge" aria-pressed="false">Kanten (en röst)</button>
    
  </div><div class="grid">
    <label>Grundton, Hz <span id="vF0"></span><input id="f0" type="range" min="30" max="220" step="0.01" value="45"></label>
    <label>Omfång kärna↔ekvator, oktaver <span id="vOct"></span><input id="oct" type="range" min="0" max="6" step="0.25" value="3"></label>
    <label>Volym <span id="vVol"></span><input id="vol" type="range" min="0" max="1" step="0.02" value="0.5"></label>
    <label>Vissel vid födsel / död <span id="vSpit"></span><input id="spit" type="range" min="0" max="1" step="0.05" value="0.6"></label>
    <label>Deltoner per slurp (additiv) <span id="vPart"></span><input id="part" type="range" min="4" max="16" step="1" value="12"></label>
  </div>
  <div class="row" style="margin:12px 0 6px"><span>Grundton</span><button data-f0="31.32">Schumann ×4 · 31,3</button><button data-f0="62.64">Schumann ×8 · 62,6</button><button data-f0="125.28">Schumann ×16 · 125,3</button><button data-f0="136.1">OM · 136,1</button><button data-f0="54">432/8 · 54</button><button data-f0="45">45</button></div>
  <div class="row" style="margin-bottom:6px"><span>Schumann 7,83 Hz</span><button data-schm="grund" aria-pressed="true">Grundton</button><button data-schm="serie" aria-pressed="false">Serie 7,83 · 14,3 · 20,8 · 27,3 · 33,8</button></div>
  <div class="grid">
    <label>Schumann-puls, djup <span id="vSch"></span><input id="sch" type="range" min="0" max="1" step="0.02" value="0"></label>
    <label>Binaural 7,83 Hz (hörlurar) <span id="vBin"></span><input id="bin" type="range" min="0" max="1" step="0.02" value="0"></label>
    <label>Slurp-bas, underton f₀/2 <span id="vSub"></span><input id="sub" type="range" min="0" max="1" step="0.02" value="0"></label>
  </div></div>

  <div class="group"><h3>Slurpar och axlar</h3><div class="grid">
    <label>Antal slurpar <span id="vN"></span><input id="N" type="range" min="1" max="12" step="1" value="3"></label>
    <label>Off: lutning mot nästa axel, rad <span id="vOff"></span><input id="off" type="range" min="0" max="2.5" step="0.005" value="0.14"></label>
    <label>Hela uppsättningen: gir <span id="vGir"></span><input id="gir" type="range" min="-3.14" max="3.14" step="0.02" value="0"></label>
    <label>Hela uppsättningen: lutning <span id="vLut"></span><input id="lut" type="range" min="-1.57" max="1.57" step="0.02" value="0"></label>
    <div class="row" style="grid-column:1/-1"><span>Båda håll på axeln</span><button data-both="off" aria-pressed="true">Av</button><button data-both="both" aria-pressed="false">Samtidigt</button><button data-both="alt" aria-pressed="false">Växelvis per kosmos</button></div>
    <div class="row" style="grid-column:1/-1"><span>Off-preset</span><button data-off="0">0</button><button data-off="0.14">0,14</button><button data-off="0.2618">π/12</button><button data-off="0.3927">π/8</button><button data-off="0.382">1/φ²</button><button data-off="0.5236">π/6</button><button data-off="0.618">1/φ</button><button data-off="0.7854">π/4</button><button data-off="1.0">1</button><button data-off="1.5708">π/2</button><button data-off="2.399">φ-vinkel</button></div>
    <label class="chk"><input id="alt" type="checkbox"> Varannan slurp vänd (riktning)</label>
    <label class="chk"><input id="mirror" type="checkbox"> Spegla hela uppsättningen (kiralitet)</label>
  </div></div>

  <div class="group"><h3>Fart</h3><div class="grid">
    <label>Sekunder per kosmos <span id="vT"></span><input id="T" type="range" min="4" max="60" step="1" value="14"></label>
    <div class="row" style="margin-bottom:6px"><span>Fartlag</span><button data-law="hand" aria-pressed="true">Handsatt 1+ε·cos σ</button><button data-law="derived" aria-pressed="false">Härledd c/ρᵖ</button></div>
    <label>ε (handsatt) <span id="vEps"></span><input id="eps" type="range" min="0" max="0.92" step="0.02" value="0.56"></label>
    <label>p (härledd) <span id="vP"></span><input id="pexp" type="range" min="0.25" max="2" step="0.05" value="1"></label>
    <label>Fasspridning mellan slurpar, andel av cykel <span id="vSpread"></span><input id="spread" type="range" min="0" max="1" step="0.02" value="0"></label>
    <label>Generationer per slurp <span id="vG"></span><input id="gens" type="range" min="1" max="4" step="1" value="1"></label>
    <label>Fas, manuellt (pausar) <span id="vQ"></span><input id="q" type="range" min="0" max="2" step="0.005" value="0.3"></label>
    <label class="chk"><input id="rev" type="checkbox"> Baklänges (tidens riktning)</label>
  </div></div>

  <div class="group"><h3>Storlek och form</h3><div class="grid">
    <label>Skala <span id="vScale"></span><input id="scale" type="range" min="0.3" max="1.6" step="0.02" value="1"></label>
    <label>Storleksfall, sista/första <span id="vFall"></span><input id="fall" type="range" min="0.3" max="1" step="0.02" value="1"></label>
    <label>Kärnans tratt: smal ↔ vid <span id="vCore"></span><input id="core" type="range" min="0.15" max="1.1" step="0.05" value="0.5"></label>
    <label>Höjd/bredd <span id="vZ"></span><input id="zs" type="range" min="0.6" max="1.6" step="0.02" value="1.05"></label>
    <label>Torsion, varv per meridian <span id="vTau"></span><input id="tau" type="range" min="-1" max="1" step="0.05" value="0.5"></label>
    <label>Åsar (frekvens) <span id="vK"></span><input id="K" type="range" min="3" max="48" step="1" value="12"></label>
    <label>Åsdjup, relativt radien <span id="vAmp"></span><input id="amp" type="range" min="0" max="0.4" step="0.01" value="0.15"></label>
    <label class="chk"><input id="grooves" type="checkbox" checked> Rita fårorna (ljusa)</label>
    <label>Ringar <span id="vM"></span><input id="M" type="range" min="8" max="100" step="1" value="24"></label>
  </div></div>

  <div class="group"><h3>Ton och visning</h3><div class="grid">
    <div class="row" style="margin-bottom:6px;grid-column:1/-1"><span>Bakgrund</span><button data-bg="white" aria-pressed="true">Vit</button><button data-bg="grey" aria-pressed="false">Mellangrå</button><button data-bg="orange" aria-pressed="false">Orange</button></div>
    <div class="row" style="margin-bottom:6px"><span>Ton efter</span><button data-tone="radius" aria-pressed="true">Radie (relativ)</button><button data-tone="depth" aria-pressed="false">Djup</button><button data-tone="polar" aria-pressed="false">Polär: vit utskjut → svart insug</button><button data-tone="flat" aria-pressed="false">Platt svart</button></div>
    <label>Linjetyngd <span id="vW"></span><input id="w" type="range" min="0.3" max="2.5" step="0.1" value="1"></label>
    <label class="chk"><input id="rings" type="checkbox" checked> Ringar</label>
    <label class="chk"><input id="ribs" type="checkbox" checked> Åsar</label>
    <label class="chk"><input id="mouths" type="checkbox" checked> Front och svans tjocka</label>
    <label class="chk"><input id="word" type="checkbox" checked> Ordet</label>
    <label class="chk"><input id="drift" type="checkbox" checked> Långsam rotation kring axeln</label>
  </div></div>
</div>



<script>
(function(){
const $=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg';
const DEF={syn:'additive',part:12,wave:'triangle',f0:45,oct:3,vol:0.5,spit:0.6,amp:0.15,grooves:true,N:3,off:0.14,gir:0,lut:0,both:'off',bg:'white',alt:false,mirror:false,T:14,law:'hand',eps:0.56,pexp:1,spread:0,gens:1,rev:false,scale:1,fall:1,core:0.5,zs:1.05,tau:0.5,K:12,M:24,tone:'radius',sch:0,schm:'grund',bin:0,sub:0,w:1,rings:true,ribs:true,mouths:true,word:true,drift:true};
let P=Object.assign({},DEF);
P.play=!matchMedia('(prefers-reduced-motion: reduce)').matches;P.snd=false;
const cam={yaw:0.6,el:0.35,zoom:1};
const views={tre:{yaw:0.6,el:0.35},ovan:{yaw:0.3,el:1.55},sida:{yaw:0,el:0.05},under:{yaw:0.3,el:-1.5}};
let goal=null,psi=0,time=0,last=performance.now(),QS=new Array(24).fill(0);

/* ---------- geometri ---------- */
const A=1.0;
function rho(sg){const sn=Math.sin(sg/2);return Math.max(A*sn*(P.core+(1.3-P.core)*sn*sn),0.003);}
function zz(sg){return A*P.zs*Math.sin(sg);}
const RMAX=()=>1.3*A*(1+P.amp);
function pt(sg,u,out,B){const uu=u+P.tau*sg*(P.mirror?-1:1),r=rho(sg)*B.scl*(1+P.amp*Math.cos(P.K*u));  // åsar: amplitud ∝ ρ, alltså noll i punkten, störst vid ekvatorn; u = läge i tvärsnittet, åskrön vid u = 2πi/K
  const x=r*Math.cos(uu),y=zz(sg)*B.scl*B.sgn,z=r*Math.sin(uu);
  const m=B.m;out[0]=m[0]*x+m[1]*y+m[2]*z;out[1]=m[3]*x+m[4]*y+m[5]*z;out[2]=m[6]*x+m[7]*y+m[8]*z;}
function proj(p,o){const cy=Math.cos(cam.yaw),sy=Math.sin(cam.yaw),ce=Math.cos(cam.el),se=Math.sin(cam.el);
  const x=p[0]*cy+p[2]*sy,z=-p[0]*sy+p[2]*cy;o[0]=x;o[1]=-(p[1]*ce-z*se);o[2]=p[1]*se+z*ce;}
function rotTo(d){const L=Math.hypot(d[0],d[1],d[2]),dx=d[0]/L,dy=d[1]/L,dz=d[2]/L;
  if(dy>0.9999)return [1,0,0,0,1,0,0,0,1];if(dy<-0.9999)return [1,0,0,0,-1,0,0,0,-1];
  const ax=dz,az=-dx,c=dy,sn=Math.hypot(ax,az),ux=ax/sn,uz=az/sn,t=1-c;
  return [c+ux*ux*t,-uz*sn,ux*uz*t, uz*sn,c,-ux*sn, ux*uz*t,ux*sn,c+uz*uz*t];}
function dirs(n){
  if(n===1)return [[0,1,0]];
  if(n===2)return [[0,1,0],[0,-1,0]];
  if(n===3){const a=[[0,1,0],[-1,0,0],[0,0,1]],o=Math.tan(P.off)*(P.mirror?-1:1);return a.map((v,i)=>{const w=a[(i+1)%3];return [v[0]+o*w[0],v[1]+o*w[1],v[2]+o*w[2]];});}
  if(n===6){const a=[[0,1,0],[-1,0,0],[0,0,1],[0,-1,0],[1,0,0],[0,0,-1]],o=Math.tan(P.off)*(P.mirror?-1:1);return a.map((v,i)=>{const w=a[(i+1)%3+(i>=3?3:0)];return [v[0]+o*w[0],v[1]+o*w[1],v[2]+o*w[2]];});}
  /* övriga: Fibonacci-sfär, med off som vridning kring varje punkt */
  const out=[],g=Math.PI*(3-Math.sqrt(5));
  for(let i=0;i<n;i++){const y=1-2*(i+0.5)/n,r=Math.sqrt(1-y*y),th=g*i+P.off*3;out.push([r*Math.cos(th),y,r*Math.sin(th)]);}
  return out;
}
let BODIES=[];
function setBodies(){
  const cg=Math.cos(P.gir),sg=Math.sin(P.gir),cl=Math.cos(P.lut),sl=Math.sin(P.lut);
  BODIES=dirs(P.N).map((d,i)=>{
    let x=d[0]*cg+d[2]*sg,z=-d[0]*sg+d[2]*cg,y=d[1];           // gir kring y
    const y2=y*cl-z*sl,z2=y*sl+z*cl;                            // lutning kring x
    const n=P.N,scl=P.scale*(n>1?1-(1-P.fall)*i/(n-1):1);
    return {m:rotTo([x,y2,z2]),scl,sgn:(P.alt&&i%2===1)?-1:1,cyc:0};
  });
  if(P.both==='both'){BODIES=BODIES.concat(BODIES.map(B=>Object.assign({},B,{sgn:-B.sgn})));}
}
function ends(q){q=((q%2)+2)%2;if(q<1)return [2*Math.PI*q,0];return [2*Math.PI,2*Math.PI*(q-1)];}

/* ---------- rendering ---------- */
const BANDS=16;   // fler band = jämnare gradient
function bandOf(r,depthT,sg){if(P.tone==='flat')return BANDS-1;const t=P.tone==='polar'?sg/(2*Math.PI):P.tone==='depth'?depthT:r/RMAX();return Math.max(0,Math.min(BANDS-1,Math.floor(t*BANDS)));}   // linjärt över hela sträckan
function frameData(){
  const raw=[];const a=[0,0,0],b=[0,0,0],pa=[0,0,0],pb=[0,0,0],nS=P.M*2,n=Math.max(64,P.K*10);
  for(let bi=0;bi<BODIES.length;bi++)for(let g=0;g<P.gens;g++){const B=BODIES[bi],[head,tail]=ends(QS[bi]+2*g/P.gens);const Lm=head-tail;if(Lm<0.02)continue;
    if(P.ribs)for(let i=0;i<P.K;i++){const u=i*2*Math.PI/P.K;
      for(let j=0;j<nS;j++){const s0=tail+Lm*j/nS,s1=tail+Lm*(j+1)/nS;pt(s0,u+psi,a,B);pt(s1,u+psi,b,B);proj(a,pa);proj(b,pb);raw.push([pa[0],pa[1],pb[0],pb[1],(pa[2]+pb[2])/2,rho((s0+s1)/2)*(1+P.amp),0,(s0+s1)/2]);}}
    if(P.grooves&&P.amp>0)for(let i=0;i<P.K;i++){const u=(i+0.5)*2*Math.PI/P.K;
      for(let j=0;j<nS;j++){const s0=tail+Lm*j/nS,s1=tail+Lm*(j+1)/nS;pt(s0,u+psi,a,B);pt(s1,u+psi,b,B);proj(a,pa);proj(b,pb);raw.push([pa[0],pa[1],pb[0],pb[1],(pa[2]+pb[2])/2,rho((s0+s1)/2)*(1-P.amp)*0.6,0,(s0+s1)/2]);}}
    if(P.rings)for(let j=0;j<=P.M;j++){const sg=tail+Lm*j/P.M,mouth=(P.mouths&&(j===0||j===P.M))?1:0;
      for(let i=0;i<n;i++){pt(sg,i*2*Math.PI/n+psi,a,B);pt(sg,(i+1)*2*Math.PI/n+psi,b,B);proj(a,pa);proj(b,pb);raw.push([pa[0],pa[1],pb[0],pb[1],(pa[2]+pb[2])/2,rho(sg),mouth,sg]);}}
  }
  let zmin=1e9,zmax=-1e9;for(const s of raw){if(s[4]<zmin)zmin=s[4];if(s[4]>zmax)zmax=s[4];}
  const d=[];for(let k=0;k<2*BANDS;k++)d.push([]);
  for(const s of raw){const k=bandOf(s[5],(s[4]-zmin)/(zmax-zmin+1e-9),s[7])+(s[6]?BANDS:0);d[k].push(s);}
  return d;
}
function bandPath(list,sc,ox,oy){let str='';for(const s of list){str+='M'+(ox+s[0]*sc).toFixed(2)+' '+(oy+s[1]*sc).toFixed(2)+'L'+(ox+s[2]*sc).toFixed(2)+' '+(oy+s[3]*sc).toFixed(2);}return str;}
function widths(k,unit){const t=(k%BANDS)/(BANDS-1);return (0.2+0.8*t)*unit*(k>=BANDS?2.2:1);}
function opac(k){if(P.bg!=='white')return 1;if(P.tone==='flat'||P.tone==='polar')return 1;const t=(k%BANDS)/(BANDS-1);return 0.08+0.92*t;}
const BG={white:'#ffffff',grey:'#8a8a8a',orange:'#e0621c'};

function advance(Qv,dt){
  let q=((Qv%2)+2)%2,sg=(q<1?q:q-1)*2*Math.PI;
  const dir=P.rev?-1:1;
  const om=P.law==='derived'?4*Math.PI/P.T:4*Math.PI/(P.T*Math.sqrt(1-P.eps*P.eps));
  sg+=dir*dt*om*speedAt(sg);
  if(sg>=2*Math.PI){sg-=2*Math.PI;q=(q<1)?1:0;}
  if(sg<0){sg+=2*Math.PI;q=(q<1)?1:0;}
  return (q<1?0:1)+sg/(2*Math.PI);
}

/* ---------- ljud: geometrin som spektrum, REV Y ---------- */
/* Kärnan och ekvatorn är två olika ljud: kärna = ren sinus, hög, komprimerad, ingen svävning, inga åsar.
   Ekvator = såg, låg, torsionssvävning, åsarna som amplitudmodulation. Varje delton är en blandning efter sin plats.
   Lika styrka per delton så att kärnan hörs. Big Spit: spektrumet föds smalt och högt, paraplyar ut.
   Big Slurp: polariteten byts i hel sfär (fas, panorering, svävningsriktning) och spektrumet sluter sig uppåt. Vissel in/ut vid födsel/död. */
let AC=null,master=null,voices=[],SCH=null;

function initAudio(){
  AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=0;
  const comp=AC.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=3;comp.knee.value=10;
  /* Schumann: amplitudmodulation av hela ytan vid 7,83 Hz (och serien 14,3 · 20,8 · 27,3 · 33,8), binauralt par (vänster f, höger f+7,83), underton f0/2 */
  const am=AC.createGain();am.gain.value=1;master.connect(am);am.connect(comp);comp.connect(AC.destination);
  const SCHF=[7.83,14.3,20.8,27.3,33.8],lfo=SCHF.map(f=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;g.gain.value=0;o.connect(g);g.connect(am.gain);o.start();return g;});
  const mk=(pan)=>{const o=AC.createOscillator(),g=AC.createGain(),p=AC.createStereoPanner?AC.createStereoPanner():AC.createGain();o.type='sine';g.gain.value=0;if(p.pan)p.pan.value=pan;o.connect(g);g.connect(p);p.connect(comp);o.start();return {o,g};};
  const bL=mk(-1),bR=mk(1),sub=mk(0);sub.o.type='triangle';
  SCH={am,lfo,bL,bR,sub};
  for(let i=0;i<MAXV;i++){const pan=AC.createStereoPanner?AC.createStereoPanner():AC.createGain(),vg=AC.createGain(),pol=AC.createGain();vg.gain.value=0;pol.gain.value=1;
    vg.connect(pol);pol.connect(pan);pan.connect(master);
    const parts=[];for(let j=0;j<MAXP;j++){const sn=AC.createOscillator(),sw=AC.createOscillator(),sw2=AC.createOscillator(),gs=AC.createGain(),gw=AC.createGain();
      sn.type='sine';sw.type='sawtooth';sw2.type='sawtooth';gs.gain.value=0;gw.gain.value=0;sn.connect(gs);sw.connect(gw);sw2.connect(gw);gs.connect(vg);gw.connect(vg);sn.start();sw.start();sw2.start();
      parts.push({sn,sw,sw2,gs,gw});}
    voices.push({vg,pol,pan,parts});}
}
function gliss(i,down){
  if(!AC||P.spit<=0)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type='sine';
  const top=Math.min(14000,P.f0*Math.pow(2,P.oct)*6),bot=P.f0*Math.pow(2,P.oct)*1.2,d=0.22;
  if(down){o.frequency.setValueAtTime(top,t);o.frequency.exponentialRampToValueAtTime(bot,t+d);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(P.spit*0.5,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+d);}
  else{o.frequency.setValueAtTime(bot,t);o.frequency.exponentialRampToValueAtTime(top,t+d);g.gain.setValueAtTime(P.spit*0.5,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);}
  o.connect(g);g.connect(master);o.start(t);o.stop(t+d+0.05);

function spitBurst(i){gliss(i,true);}
const RATIOS=[1,3/2,2,9/8,5/4,4/3,5/3,15/8,2.25,2.5,3,3.375];
let prevPol=[];
function updateAudio(){
  if(!AC)return;const t=AC.currentTime;master.gain.setTargetAtTime(P.snd?P.vol*0.35:0,t,0.05);
  if(SCH){const on=P.snd?1:0,q0=((QS[0]%2)+2)%2,[h0,t0]=ends(QS[0]),ar0=(h0-t0)/(2*Math.PI);
    SCH.am.gain.setTargetAtTime(1-P.sch*0.5,t,0.05);
    SCH.lfo.forEach((g,n)=>g.gain.setTargetAtTime(P.schm==='serie'?P.sch*0.5/(n+1)*(n?0.6:1):(n?0:P.sch*0.5),t,0.05));
    const fc=P.f0*4,bg_=on*P.bin*0.18*P.vol*Math.sqrt(Math.max(ar0,0.02)); // binaural: vänster f, höger f+7,83; polariteten byts i Big Slurp
    SCH.bL.o.frequency.setTargetAtTime(q0<1?fc:fc+7.83,t,0.05);SCH.bR.o.frequency.setTargetAtTime(q0<1?fc+7.83:fc,t,0.05);
    SCH.bL.g.gain.setTargetAtTime(bg_,t,0.1);SCH.bR.g.gain.setTargetAtTime(bg_,t,0.1);
    SCH.sub.o.frequency.setTargetAtTime(P.f0/2,t,0.05);SCH.sub.g.gain.setTargetAtTime(on*P.sub*0.3*P.vol*ar0,t,0.1);} // undertonen växer med ytan
  const nb=BODIES.length,np=P.syn==='edge'?1:Math.min(MAXP,Math.max(4,Math.floor(P.part*Math.min(1,6/nb))));
  const drift=P.drift?0.11*Math.SQRT2:0,tremHz=Math.max(0.3,P.K*drift/(2*Math.PI));
  for(let i=0;i<MAXV;i++){const v=voices[i],B=BODIES[i];
    if(!B){v.vg.gain.setTargetAtTime(0,t,0.05);continue;}
    const ratio=RATIOS[i%Math.max(1,P.N)%RATIOS.length]*(i>=P.N?0.5:1),detune=1+P.off*0.03*((i%3)-1);
    const [hd,tl]=ends(QS[i]),q=((QS[i]%2)+2)%2,area=(hd-tl)/(2*Math.PI),pol=q<1?1:-1;
    if(prevPol[i]===-1&&pol===1)gliss(i,false);
    prevPol[i]=pol;
    v.pol.gain.setTargetAtTime(pol,t,0.02);
    if(v.pan.pan){const m=B.m;v.pan.pan.setTargetAtTime(Math.max(-1,Math.min(1,m[1]*0.9*pol)),t,0.1);}
    for(let j=0;j<MAXP;j++){const pt_=v.parts[j];
      if(j>=np||area<0.005){pt_.gs.gain.setTargetAtTime(0,t,0.03);pt_.gw.gain.setTargetAtTime(0,t,0.03);continue;}
      const sg=P.syn==='edge'?(q<1?hd:tl):tl+(hd-tl)*(j+0.5)/np, r=Math.max(rho(sg),0.05*A)/RMAX();
      const f=Math.min(16000,P.f0*ratio*detune*Math.pow(1/r,P.oct/Math.log2(1/0.04)));
      const core=Math.pow(1-r,2),eq=1-core;
      const beat=1+0.006*P.tau*eq*pol;
      const trem=1-P.amp*2*eq*(0.5+0.5*Math.sin(2*Math.PI*tremHz*time+j));
      pt_.sn.frequency.setTargetAtTime(f,t,0.03);pt_.sw.frequency.setTargetAtTime(f,t,0.03);pt_.sw2.frequency.setTargetAtTime(f*beat,t,0.03);
      pt_.gs.gain.setTargetAtTime(core,t,0.04);pt_.gw.gain.setTargetAtTime(eq*0.35*trem,t,0.04);}
    v.vg.gain.setTargetAtTime(Math.pow(area,0.5)/np*2.2/Math.sqrt(nb),t,0.05);
  }
}
